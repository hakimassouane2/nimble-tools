<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="copper" x1="20" y1="8" x2="80" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4a574"/>
      <stop offset="1" stop-color="#96693f"/>
    </linearGradient>
  </defs>

  <!-- Contour hexagonal du d20 -->
  <path d="M50 5 L88.97 27.5 L88.97 72.5 L50 95 L11.03 72.5 L11.03 27.5 Z"
        fill="url(#copper)" fill-opacity="0.12"
        stroke="url(#copper)" stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Face centrale -->
  <path d="M50 30 L73 70 L27 70 Z"
        fill="url(#copper)" fill-opacity="0.22"
        stroke="url(#copper)" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Aretes vers les sommets -->
  <g stroke="url(#copper)" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="30" x2="50" y2="5"/>
    <line x1="27" y1="70" x2="11.03" y2="72.5"/>
    <line x1="73" y1="70" x2="88.97" y2="72.5"/>
  </g>

  <!-- Le "20" de la face superieure -->
  <text x="50" y="58" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700"
        fill="url(#copper)">20</text>
</svg>
